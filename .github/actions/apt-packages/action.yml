name: Install system packages
description: >-
  Installs Ubuntu packages a job needs beyond what the runner image has, such
  as the D-Bus daemon the notification service's tests run on, with
  `cargo xtask ci-packages`: an unreachable package server fails the step
  within minutes, saying so. Runs after the toolchain is set up; xtask builds
  without any of these packages.

inputs:
  packages:
    description: Space-separated Ubuntu package names.
    required: true

runs:
  using: composite
  steps:
    - name: Install the packages
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      # Word splitting of the list into package names is intended.
      # shellcheck disable=SC2086
      run: cargo xtask ci-packages $PACKAGES
