name: CI

on:
  pull_request:
  push:
    branches: [main]

# Every job only reads the repository.
permissions:
  contents: read

# A newer push to the same pull request or branch supersedes a running check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # What building rinch needs beyond the runner image: GTK for its native
  # menus (muda) and libxdo for their accelerators. Every job that builds the
  # whole workspace, or a rinch program, installs these: the compositor
  # tests' build job builds the components.
  RINCH_BUILD_PACKAGES: libgtk-3-dev libxdo-dev

# Every job has a time limit, so a hang ends it instead of holding a runner
# for GitHub's six hours: each is many times the job's usual time with a
# warm cache, leaving room for a cold build of the whole workspace and for
# the package install, which bounds itself to what the tightest job leaves
# it (`ci-packages`'s test `the_whole_step_fits_the_tightest_job`).
#
# Packages are installed after the toolchain and the build cache, by
# `cargo xtask ci-packages`, which needs none of them to build, from a cache
# of their own (`.github/actions/apt-packages`).
#
# Third-party actions are pinned to a full commit SHA, with the release it is
# in the comment beside it. The commands are the ones README.md lists.
jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: ./.github/actions/build-cache
      - uses: ./.github/actions/apt-packages
        with:
          packages: ${{ env.RINCH_BUILD_PACKAGES }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-26.04
    # The property tests bound each case (10 s) and their number (512); this
    # bounds the job as a whole should anything else hang.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: ./.github/actions/build-cache
      # The notification service's tests run on private D-Bus daemons and
      # check interoperability with libnotify's notify-send.
      - uses: ./.github/actions/apt-packages
        with:
          packages: dbus-daemon libnotify-bin ${{ env.RINCH_BUILD_PACKAGES }}
      # Every test binary runs, whatever fails before it, so that one run
      # reports every failure.
      - run: cargo test --workspace --locked --no-fail-fast
      # deskrinch-component's other arm: a build with `debug`, where the
      # components answer rinch's DevTools keys.
      - run: cargo test -p deskrinch-component --locked --features debug

  # Every crate's documentation, as `cargo doc` builds it: a broken or
  # private intra-doc link, or any other rustdoc warning, fails it.
  docs:
    name: Documentation
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: ./.github/actions/build-cache
      - uses: ./.github/actions/apt-packages
        with:
          packages: ${{ env.RINCH_BUILD_PACKAGES }}
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: Licences and advisories
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      # A prebuilt, checksum-verified cargo-deny at an exact version.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  file-length:
    name: Source file length
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: ./.github/actions/build-cache
      - run: cargo xtask file-length

  # The window-management and screen-capture crates against real
  # compositors, nested and headless: the versions deskrinch targets, as
  # Ubuntu 26.04 packages them. One job builds everything the suites run,
  # once, into a bundle (`cargo xtask bundle build`); shard jobs, each one
  # compositor's share of the suites (`xtask/src/compositor_tests/shards.rs`,
  # which this matrix comes from), run it and build nothing.
  #
  # The budget, queue time excluded: the build job and the slowest shard
  # together at or under 20 minutes with a warm build cache and 25 with a
  # cold one, and each shard job at or under 15 minutes. What the suites
  # cost is printed at the end of each shard's `compositor-tests`, and the
  # bundle's size and packing time in the build job.
  compositor-build:
    name: Compositor tests' build
    runs-on: ubuntu-26.04
    # A guard against a hung job, not its budget: about three times a build
    # with a cold cache (8 to 9 minutes) and its package install.
    timeout-minutes: 30
    env:
      # The bundle keeps line tables, so that a backtrace from a shard keeps
      # its files and lines, without the rest of the debug information (2.5
      # of 6.5 GB raw, about 400 MB packed). It is part of the build cache's
      # key, as every CARGO variable is.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    outputs:
      bundle: ${{ steps.bundle.outputs.name }}
      shards: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      # The cache the three compositor jobs that built for themselves shared
      # keeps its name.
      - uses: ./.github/actions/build-cache
        with:
          shared-key: compositor-tests
      - uses: ./.github/actions/apt-packages
        with:
          packages: ${{ env.RINCH_BUILD_PACKAGES }}
      # Named for the run's attempt: a re-run of this job uploads a bundle
      # of its own, and the shards take the name from its output, so a
      # re-run of a shard alone finds the bundle its attempt built.
      - name: Build the bundle
        id: bundle
        run: |
          name="compositor-bundle-${{ github.run_attempt }}.tar.zst"
          cargo xtask bundle build "$RUNNER_TEMP/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: The shards
        id: shards
        run: |
          matrix=$(cargo xtask compositor-shards)
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      # Uploaded as it is, not zipped again (`archive: false`): it is
      # compressed already, and a zip would lose the binaries' modes.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/${{ steps.bundle.outputs.name }}
          archive: false
          retention-days: 1
          if-no-files-found: error

  compositor-tests:
    name: Compositor tests (${{ matrix.shard }})
    needs: compositor-build
    runs-on: ubuntu-26.04
    # A guard against a hung job, not its budget (15 minutes): twice that,
    # which also leaves the package step the whole of its own limit
    # (`ci-packages`'s budget) after the shard's other steps.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compositor-build.outputs.shards) }}
    env:
      # Each compositor's packages. kwin-common carries KWin's plugins, its
      # screenshot interface among them (kwin-wayland only recommends it);
      # libgl1-mesa-dri is Mesa's software driver, which KWin renders with
      # on vgem's device; kscreen-doctor (libkscreen-bin) sets the outputs'
      # scale, through Qt's Wayland platform, whose xdg-shell integration is
      # libqt6wlshellintegration6. Valgrind is for measure's Callgrind runs.
      COMPOSITOR_PACKAGES: >-
        {"kwin": "kwin-wayland kwin-common libgl1-mesa-dri dbus-daemon
        libkscreen-bin libqt6wlshellintegration6 valgrind",
        "sway": "sway dbus-daemon valgrind",
        "labwc": "labwc dbus-daemon valgrind"}
      # What the bundle's binaries load beyond the runner image and the
      # compositor's packages: libxdo, for rinch's menu accelerators.
      # `bundle check` proves it with ldd before anything runs.
      RINCH_RUN_PACKAGES: libxdo3
      BUNDLE: ${{ needs.compositor-build.outputs.bundle }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.BUNDLE }}
          path: ${{ runner.temp }}
      # At the workspace root: the tests run xtask by the path compiled into
      # them, which `bundle check` holds the bundle to.
      - name: Unpack the bundle
        run: tar --use-compress-program=zstd -xf "$RUNNER_TEMP/$BUNDLE"
      # The steps after the compositor tests that run when those failed ask
      # for these two by id: they run on a compositor that was installed (and
      # under KWin given its device), and not after the setup failed, where
      # every test of theirs would fail for want of a compositor and bury
      # the one real error.
      - id: packages
        uses: ./.github/actions/apt-packages
        with:
          packages: ${{ fromJSON(env.COMPOSITOR_PACKAGES)[matrix.compositor] }} ${{ env.RINCH_RUN_PACKAGES }}
          xtask: target/debug/xtask
      - name: Show the ${{ matrix.compositor }} version tested
        env:
          COMPOSITOR: ${{ matrix.compositor }}
        # kscreen-doctor has no --version, and starts Qt even to fail: its
        # package's version says what was installed.
        run: |
          case "$COMPOSITOR" in
            kwin) kwin_wayland --version
                  dpkg-query -W -f='${Package} ${Version}\n' libkscreen-bin ;;
            *) "$COMPOSITOR" --version ;;
          esac
      # The runner has no GPU, and KWin's virtual backend composites with
      # OpenGL only on a DRM device; without OpenGL, ScreenShot2 captures
      # nothing. vgem is a kernel-side virtual device for exactly this (KWin's
      # own CI uses it), rendered to with Mesa's software driver.
      - name: Give KWin a DRM device to render on
        id: drm
        if: matrix.compositor == 'kwin'
        # KWin's virtual backend opens vgem's primary node (card*), which
        # udev makes root:video once it has seen the device: let it finish
        # first, then open the nodes to the runner's user.
        run: |
          sudo modprobe vgem
          sudo udevadm settle
          sudo chmod a+rw /dev/dri/card* /dev/dri/renderD*
          ls -l /dev/dri
      # Built in this checkout, its files in place, every library its
      # binaries need here; and whether it was built on this runner image.
      - name: Check the bundle
        run: target/debug/xtask bundle check
      # The runner's only DRM device is vgem, which is not a GPU.
      - run: target/debug/xtask compositor-tests --renderer software --prebuilt --shard ${{ matrix.shard }}
      # The real panel, measured once, presenting with rinch's software
      # renderer: a check that measure still reads rinch's frames and
      # renderer lines from a real component. It runs after a failure in the
      # compositor tests too, which must not hide what it would show.
      # The panel is the one the compositor tests start, the bundle's.
      - name: Measure the panel under sway
        if: ${{ !cancelled() && matrix.session_tests && matrix.compositor == 'sway' && steps.packages.outcome == 'success' }}
        run: |
          # On a line of its own, so that a missing panel fails the step.
          panel=$(target/debug/xtask bundle component deskrinch-panel)
          # A bar per output, in a window of its own: one output, one bar.
          target/debug/xtask measure --compositor sway --runs 1 --settle 1 --idle 5 \
            --windows 1 --renderer software --expect-renderer software "$panel"
      # Under KWin the panel binds window management, which KWin grants only
      # to an executable a desktop file names: under Callgrind that is
      # Valgrind's tool, which measure grants as the shell grants the panel.
      # measure fails a run whose program logs an error, so if the grant ever
      # stops working, this run says so.
      - name: Measure the panel under KWin, under Callgrind
        if: ${{ !cancelled() && matrix.session_tests && matrix.compositor == 'kwin' && steps.drm.outcome == 'success' }}
        run: |
          # On a line of its own, so that a missing panel fails the step.
          panel=$(target/debug/xtask bundle component deskrinch-panel)
          # A bar per output, in a window of its own: one output, one bar.
          target/debug/xtask measure --compositor kwin --runs 1 --settle 2 --idle 2 \
            --windows 1 --instructions --renderer software \
            --expect-renderer software "$panel"
      - name: Test cargo xtask session and measure under ${{ matrix.compositor }}
        # It runs after a failure in the compositor tests too, which must not
        # hide what it would show; and each binary runs whatever fails before
        # it. Not after the compositor's setup failed (above).
        if: >-
          ${{ !cancelled() && matrix.session_tests && steps.packages.outcome == 'success'
          && (matrix.compositor != 'kwin' || steps.drm.outcome == 'success') }}
        run: target/debug/xtask session-tests --prebuilt ${{ matrix.compositor }}

  # The desktop-entries launch into a real transient scope. The runner has
  # systemd as PID 1 but no user session; lingering starts the runner
  # user's systemd instance, and dbus-user-session gives it a user bus.
  systemd-scope-tests:
    name: Systemd scope test
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: ./.github/actions/build-cache
      - uses: ./.github/actions/apt-packages
        with:
          packages: dbus-user-session
      - name: Start the runner user's systemd instance
        run: |
          sudo loginctl enable-linger "$USER"
          runtime="/run/user/$(id -u)"
          for _ in $(seq 100); do
            [ -S "$runtime/bus" ] && break
            sleep 0.1
          done
          test -S "$runtime/bus"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime/bus" >> "$GITHUB_ENV"
      - name: Wait for systemd on the user bus
        # The first client starts the socket-activated bus, and systemd
        # connects to it only once it is up.
        run: |
          for _ in $(seq 100); do
            busctl --user status org.freedesktop.systemd1 > /dev/null 2>&1 && break
            sleep 0.1
          done
          busctl --user status org.freedesktop.systemd1 > /dev/null
          systemctl --user show --property=Version,SystemState
      - run: cargo xtask systemd-scope-tests
