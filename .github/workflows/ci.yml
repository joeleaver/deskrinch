name: CI

on:
  pull_request:
  push:
    branches: [main]

# Every job only reads the repository.
permissions:
  contents: read

# A newer push to the same pull request or branch supersedes a running check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # What building rinch needs beyond the runner image: GTK for its native
  # menus (muda) and libxdo for their accelerators. Every job that builds the
  # whole workspace installs these.
  RINCH_BUILD_PACKAGES: libgtk-3-dev libxdo-dev

# Every job has a time limit, so a hang ends it instead of holding a runner
# for GitHub's six hours: each is many times the job's usual time with a
# warm cache, leaving room for a cold build of the whole workspace and for
# the package install, which bounds itself at ten minutes.
#
# Packages are installed after the toolchain and the cache, by
# `cargo xtask ci-packages`, which needs none of them to build.
#
# Third-party actions are pinned to a full commit SHA, with the release it is
# in the comment beside it. The commands are the ones README.md lists.
jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/apt-packages
        with:
          packages: ${{ env.RINCH_BUILD_PACKAGES }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-26.04
    # The property tests bound each case (10 s) and their number (512); this
    # bounds the job as a whole should anything else hang.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The notification service's tests run on private D-Bus daemons and
      # check interoperability with libnotify's notify-send.
      - uses: ./.github/actions/apt-packages
        with:
          packages: dbus-daemon libnotify-bin ${{ env.RINCH_BUILD_PACKAGES }}
      - run: cargo test --workspace --locked

  deny:
    name: Licences and advisories
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      # A prebuilt, checksum-verified cargo-deny at an exact version.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  file-length:
    name: Source file length
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask file-length

  # The window-management and screen-capture crates against real
  # compositors, nested and headless: the versions deskrinch targets, as
  # Ubuntu 26.04 packages them. Each job prints the versions it tested.
  compositor-tests:
    name: Compositor tests (${{ matrix.compositor }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # kwin-common carries KWin's plugins, its screenshot interface
          # among them (kwin-wayland only recommends it); libgl1-mesa-dri
          # is Mesa's software driver, which KWin renders with on vgem's
          # device; kscreen-doctor (libkscreen-bin) sets the outputs' scale.
          - compositor: kwin
            packages: kwin-wayland kwin-common libgl1-mesa-dri dbus-daemon libkscreen-bin
            # kscreen-doctor has no --version, and starts Qt even to fail:
            # its package's version says what was installed.
            version: kwin_wayland --version && dpkg-query -W -f='${Package} ${Version}\n' libkscreen-bin
          - compositor: sway
            packages: sway dbus-daemon
            version: sway --version
          - compositor: labwc
            packages: labwc dbus-daemon
            version: labwc --version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/apt-packages
        with:
          packages: ${{ matrix.packages }}
      - name: Show the ${{ matrix.compositor }} version tested
        run: ${{ matrix.version }}
      # The runner has no GPU, and KWin's virtual backend composites with
      # OpenGL only on a DRM device; without OpenGL, ScreenShot2 captures
      # nothing. vgem is a kernel-side virtual device for exactly this (KWin's
      # own CI uses it), rendered to with Mesa's software driver.
      - name: Give KWin a DRM device to render on
        if: matrix.compositor == 'kwin'
        run: |
          sudo modprobe vgem
          sudo chmod a+rw /dev/dri/card*
          ls -l /dev/dri
      - run: cargo xtask compositor-tests ${{ matrix.compositor }}
      - name: Test cargo xtask session and measure under ${{ matrix.compositor }}
        run: cargo test -p xtask --test session --test measure --locked -- --ignored
        env:
          DESKRINCH_SESSION_TEST_COMPOSITOR: ${{ matrix.compositor }}

  # The desktop-entries launch into a real transient scope. The runner has
  # systemd as PID 1 but no user session; lingering starts the runner
  # user's systemd instance, and dbus-user-session gives it a user bus.
  systemd-scope-tests:
    name: Systemd scope test
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/apt-packages
        with:
          packages: dbus-user-session
      - name: Start the runner user's systemd instance
        run: |
          sudo loginctl enable-linger "$USER"
          runtime="/run/user/$(id -u)"
          for _ in $(seq 100); do
            [ -S "$runtime/bus" ] && break
            sleep 0.1
          done
          test -S "$runtime/bus"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime/bus" >> "$GITHUB_ENV"
      - name: Wait for systemd on the user bus
        # The first client starts the socket-activated bus, and systemd
        # connects to it only once it is up.
        run: |
          for _ in $(seq 100); do
            busctl --user status org.freedesktop.systemd1 > /dev/null 2>&1 && break
            sleep 0.1
          done
          busctl --user status org.freedesktop.systemd1 > /dev/null
          systemctl --user show --property=Version,SystemState
      - run: cargo xtask systemd-scope-tests
