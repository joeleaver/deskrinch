[package]
name = "xtask"
description = "Repository tasks for deskrinch, run as `cargo xtask <task>`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
deskrinch-bus.workspace = true
ctrlc.workspace = true
deskrinch-kwin-access.workspace = true
deskrinch-test-client.workspace = true
deskrinch-test-dbus.workspace = true
deskrinch-test-screen.workspace = true
deskrinch-window-management.workspace = true
rustix = { workspace = true, features = ["param", "process"] }
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
# Asking KWin how it composites, on the session's bus, driven by
# `zbus::block_on`.
zbus = { workspace = true, features = ["default-rt"] }

[lints]
workspace = true
