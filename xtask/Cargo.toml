[package]
name = "xtask"
description = "Repository tasks for deskrinch, run as `cargo xtask <task>`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
deskrinch-bus.workspace = true
ctrlc.workspace = true
deskrinch-kwin-access.workspace = true
# What the desktop runs: the shell's components and its key bindings.
deskrinch-shell.workspace = true
deskrinch-test-client.workspace = true
deskrinch-test-component.workspace = true
deskrinch-test-dbus.workspace = true
# The interface its compositor tests are granted under KWin.
deskrinch-test-input.workspace = true
deskrinch-test-screen.workspace = true
deskrinch-test-wayland.workspace = true
deskrinch-test-wait.workspace = true
deskrinch-window-management.workspace = true
rustix = { workspace = true, features = ["fs", "param", "pipe", "process"] }
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
# Following the desktop's outputs, which are its windows.
wayland-client.workspace = true
# Asking KWin how it composites, on the session's bus, driven by
# `zbus::block_on`.
zbus = { workspace = true, features = ["default-rt"] }

[dev-dependencies]
# The session tests' xtask bound to the test, and whether a process runs.
deskrinch-test-lifetime.workspace = true

[lints]
workspace = true
