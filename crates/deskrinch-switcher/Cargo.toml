[package]
name = "deskrinch-switcher"
description = "The workspace switcher's model, without a UI: which workspaces have a button, in what order, labelled and marked how, and which buttons fit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Which bars show a group's run: the bars of its outputs.
deskrinch-bars.workspace = true

[dev-dependencies]
# The property tests' configuration, shared with the other crates.
deskrinch-untrusted = { workspace = true, features = ["proptest"] }
proptest.workspace = true

[lints]
workspace = true
