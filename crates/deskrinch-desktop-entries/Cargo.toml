[package]
name = "deskrinch-desktop-entries"
description = "Finds, searches, launches and watches the applications installed on the system (freedesktop Desktop Entries)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
deskrinch-keyfile.workspace = true
deskrinch-timer.workspace = true
deskrinch-watch.workspace = true
deskrinch-xdg.workspace = true
futures-core.workspace = true
# Unicode case folding, compatibility decomposition and general categories,
# for matching searches without regard to case or diacritics.
icu_casemap.workspace = true
icu_normalizer.workspace = true
icu_properties.workspace = true
libc.workspace = true
percent-encoding.workspace = true
thiserror.workspace = true
# The client side of D-Bus on zbus's own runtime, driven by `zbus::block_on`,
# so this crate's API needs no async runtime.
zbus = { workspace = true, features = ["default-rt"] }

[dev-dependencies]
deskrinch-test-dbus.workspace = true
tempfile.workspace = true
# The tests stand in for systemd and for a D-Bus-activated application.
zbus = { workspace = true, features = ["default-rt", "service"] }

[lints]
workspace = true
