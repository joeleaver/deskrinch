[package]
name = "deskrinch-test-screen"
description = "Pictures of a nested session's outputs for deskrinch's tests: ext-image-copy-capture, wlr-screencopy or KWin's ScreenShot2."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tempfile.workspace = true
thiserror.workspace = true
wayland-client.workspace = true
wayland-protocols = { workspace = true, features = ["client", "staging"] }
wayland-protocols-wlr = { workspace = true, features = ["client"] }
# KWin's ScreenShot2: the client side of D-Bus on zbus's own runtime, driven
# by `zbus::block_on`, so this crate's API needs no async runtime.
zbus = { workspace = true, features = ["default-rt"] }

[dev-dependencies]
deskrinch-test-client.workspace = true

# The compositor tests run inside nested compositors that
# `cargo xtask compositor-tests` starts; they are ignored by a plain
# `cargo test`.
[[test]]
name = "compositor"
path = "tests/compositor/main.rs"

[[test]]
name = "wlroots"
path = "tests/wlroots/main.rs"

[[test]]
name = "kwin_not_granted"
path = "tests/kwin_not_granted.rs"

[lints]
workspace = true
