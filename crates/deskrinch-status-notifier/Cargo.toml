[package]
name = "deskrinch-status-notifier"
description = "The StatusNotifierWatcher, and a host that reads the tray's StatusNotifierItems from the bus."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
deskrinch-bus.workspace = true
deskrinch-untrusted.workspace = true
futures-core.workspace = true
# `FuturesUnordered`: every item's read runs at once on the tracker's thread,
# so a slow item holds up nothing but itself.
futures-util.workspace = true
serde.workspace = true
thiserror.workspace = true
# zbus's own runtime (`default-rt`) drives the connection on a helper thread,
# so callers need no async runtime; `service` serves the watcher.
zbus = { workspace = true, features = ["default-rt", "service"] }

[dev-dependencies]
deskrinch-test-dbus.workspace = true
# The property tests' shared configuration.
deskrinch-untrusted = { workspace = true, features = ["proptest"] }
# The interoperability test's item: a real implementation, run in a child
# process on the test's private bus. It brings zbus 5 into the dev graph only.
ksni.workspace = true
proptest.workspace = true

[lints]
workspace = true
