[package]
name = "deskrinch-test-kwin"
description = "What KWin says, and what a test may ask of it, inside an isolated session, for deskrinch's tests: its windows, effects and desktops read, its desktops and shortcuts acted on, on a bus proved ours."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The proof that a bus is ours, the only maker of a connection to one.
deskrinch-test-dbus.workspace = true
# Whether this process runs inside an isolated session, before any bus.
deskrinch-test-session.workspace = true
# How long the script's report may take: the tests' one patience.
deskrinch-test-wait.workspace = true
# Each window's record, as the script writes it.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# The script's file, for KWin to load.
tempfile.workspace = true
thiserror.workspace = true
# KWin's scripting interface, and the object the script reports to, on
# zbus's own runtime, driven by `zbus::block_on`.
zbus = { workspace = true, features = ["default-rt", "service"] }

[dev-dependencies]
# The windows the compositor tests make.
deskrinch-test-client.workspace = true

# The compositor tests run inside a nested KWin that `cargo xtask
# compositor-tests` starts; they are ignored by a plain `cargo test`.
[[test]]
name = "compositor"
path = "tests/compositor/main.rs"

[lints]
workspace = true
