[package]
name = "deskrinch-component"
description = "What every deskrinch shell component process does the same way: its settings, followed live into rinch, and its reporting."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# rinch's DevTools keys (F12, Alt+I) in the component (`app::devtools`).
# Each component's own `debug` feature turns this on. Cargo unifies features
# over one build, so when any component built together has `debug`, every
# one of them has DevTools, as with `rinch/debug`: a property of the build.
debug = []

[dependencies]
deskrinch-config.workspace = true
deskrinch-settings.workspace = true
# The exit status for a lost display, which the component's starter reads.
deskrinch-shell.workspace = true
deskrinch-xdg.workspace = true
# `desktop`: rinch's native logging (its `tracing-subscriber` formatter),
# the one a component's window runs with.
rinch = { workspace = true, features = ["desktop"] }
tracing.workspace = true

[dev-dependencies]
deskrinch-test-wait.workspace = true
# The tests define a second table type.
serde = { workspace = true, features = ["derive"] }
tempfile.workspace = true

[lints]
workspace = true
