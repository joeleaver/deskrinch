[package]
name = "deskrinch-icons"
description = "Icon names resolved to files by the freedesktop Icon Theme Specification, and followed as themes change."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
deskrinch-keyfile.workspace = true
deskrinch-watch.workspace = true
deskrinch-xdg.workspace = true
# Listing a directory into one reused buffer (getdents), without an
# allocation per entry, and lstat for an entry of unknown type.
rustix = { workspace = true, features = ["fs"] }
thiserror.workspace = true

[dev-dependencies]
# The index_cost example reads this thread's CPU clock and the page size.
rustix = { workspace = true, features = ["param", "time"] }
tempfile.workspace = true

[lints]
workspace = true
