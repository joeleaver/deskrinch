[package]
name = "deskrinch-window-management"
description = "The compositor's list of windows, and actions on them, behind one trait: KWin and wlroots backends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bitflags.workspace = true
deskrinch-wayland-client.workspace = true
thiserror.workspace = true
wayland-client.workspace = true
wayland-protocols = { workspace = true, features = ["client", "unstable"] }
wayland-protocols-plasma = { workspace = true, features = ["client"] }
wayland-protocols-wlr = { workspace = true, features = ["client"] }

[dev-dependencies]
deskrinch-test-wait.workspace = true
# The stand-in compositor, for what no real one does on cue.
deskrinch-test-wayland.workspace = true
deskrinch-test-client.workspace = true
rustix = { workspace = true, features = ["net", "process"] }

# The compositor tests run inside a nested compositor that
# `cargo xtask compositor-tests` starts; they are ignored by a plain
# `cargo test`.
[[test]]
name = "compositor"
path = "tests/compositor/main.rs"

[[test]]
name = "kwin_not_granted"
path = "tests/kwin_not_granted.rs"

[lints]
workspace = true
