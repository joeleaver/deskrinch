[package]
name = "deskrinch-appearance"
description = "The system's appearance preferences from the settings portal (the colour scheme), read and followed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
deskrinch-bus.workspace = true
# `Stream`, to poll the bus's message streams by hand.
futures-core.workspace = true
thiserror.workspace = true
# The client side of D-Bus on zbus's own runtime, driven by `zbus::block_on`
# on the crate's thread, so the API needs no async runtime.
zbus = { workspace = true, features = ["default-rt"] }

[dev-dependencies]
deskrinch-test-wait.workspace = true
deskrinch-test-dbus.workspace = true
deskrinch-test-portal.workspace = true
# The tests send a signal from an impostor connection.
zbus = { workspace = true, features = ["default-rt"] }

[lints]
workspace = true
