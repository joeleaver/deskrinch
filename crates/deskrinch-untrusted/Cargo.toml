[package]
name = "deskrinch-untrusted"
description = "The shared rules for an untrusted peer's strings, markup, pixel data and icon names."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `fuzz::config`, the property tests' shared configuration, for the
# dev-dependencies of the crates whose parsers are fuzzed.
proptest = ["dep:proptest"]

[dependencies]
# `zeroed_pixels` takes its zeroed shared buffer from bytemuck's
# `zeroed_arc_slice`, which `alloc_uninit` offers. With bytemuck 1.25.2,
# `alloc_uninit` does not compile without `zeroable_maybe_uninit` (the
# function needs `Zeroable` for `MaybeUninit`, which that feature gives),
# so it is named too.
bytemuck = { workspace = true, features = ["extern_crate_alloc", "alloc_uninit", "zeroable_maybe_uninit"] }
libc.workspace = true
proptest = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
rustix = { workspace = true, features = ["fs"] }
tempfile.workspace = true

[lints]
workspace = true
