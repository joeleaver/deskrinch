[package]
name = "deskrinch-panel"
description = "The desktop panel: a bar along the bottom of the output that windows keep clear of, with the clock."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "deskrinch-panel"
path = "src/main.rs"

[features]
# rinch's debug server, for the rinch MCP tools (screenshots, the DOM, input):
# `RINCH_DEBUG=1 cargo run -p deskrinch-panel --features debug` (built with the
# feature, the server still starts only when `RINCH_DEBUG=1` is set). Off in a
# normal build.
debug = ["rinch/debug"]

[dependencies]
deskrinch-appearance.workspace = true
deskrinch-clock.workspace = true
deskrinch-component.workspace = true
deskrinch-settings.workspace = true
deskrinch-theme.workspace = true
deskrinch-xdg.workspace = true
# `gpu` adds the GPU renderer beside the software one rinch always has on
# the desktop; which one draws is chosen at run time (see the crate docs).
# `theme`: the theme variables the bar is styled with (the look itself is
# `deskrinch-theme`'s).
rinch = { workspace = true, features = ["desktop", "gpu", "theme"] }
thiserror.workspace = true

[dev-dependencies]
deskrinch-test-wait.workspace = true
deskrinch-test-client.workspace = true
deskrinch-test-component.workspace = true
deskrinch-test-screen.workspace = true

# The compositor tests run inside nested compositors that
# `cargo xtask compositor-tests` starts; they are ignored by a plain
# `cargo test`.
[[test]]
name = "compositor"
path = "tests/compositor/main.rs"

[lints]
workspace = true
