[package]
name = "deskrinch-panel"
description = "The desktop panel: a bar along the bottom of the output that windows keep clear of, with the taskbar and the clock."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "deskrinch-panel"
path = "src/main.rs"

# What the panel says, with one home for its wording: the binary logs with
# it and the compositor tests wait with it.
[lib]
path = "src/lib.rs"

[features]
# rinch's debug server, for the rinch MCP tools (screenshots, the DOM, input):
# `RINCH_DEBUG=1 cargo run -p deskrinch-panel --features debug` (built with the
# feature, the server still starts only when `RINCH_DEBUG=1` is set), and
# rinch's DevTools keys (`deskrinch_component::app::devtools`). Off in a
# normal build.
debug = ["rinch/debug", "deskrinch-component/debug"]

[dependencies]
deskrinch-appearance.workspace = true
# The installed applications and the icon theme, for the taskbar's icons.
deskrinch-applications.workspace = true
deskrinch-clock.workspace = true
deskrinch-component.workspace = true
# The user's locales, and the applications' entries.
deskrinch-desktop-entries.workspace = true
# The icon theme's index and search path.
deskrinch-icons.workspace = true
deskrinch-settings.workspace = true
# The taskbar's and the workspace switcher's models.
deskrinch-switcher.workspace = true
deskrinch-taskbar.workspace = true
deskrinch-theme.workspace = true
# The one Wayland connection the taskbar and the switcher share.
deskrinch-wayland-client.workspace = true
# The compositor's windows, for the taskbar.
deskrinch-window-management.workspace = true
# The compositor's workspaces, for the switcher.
deskrinch-workspaces.workspace = true
deskrinch-xdg.workspace = true
# `gpu` adds the GPU renderer beside the software one rinch always has on
# the desktop; which one draws is chosen at run time (see the crate docs).
# `theme`: the theme variables the bar is styled with (the look itself is
# `deskrinch-theme`'s).
rinch = { workspace = true, features = ["desktop", "gpu", "theme"] }
thiserror.workspace = true
# Where the panel is placed, said when it moves (`deskrinch_panel::placed`),
# and what the taskbar logs, through `deskrinch-component`'s reporting.
tracing.workspace = true

[dev-dependencies]
deskrinch-shell.workspace = true
deskrinch-test-client.workspace = true
deskrinch-test-component.workspace = true
# KWin's desktops added and removed, the compositor's side of the
# switcher's tests.
deskrinch-test-desktops.workspace = true
deskrinch-test-input.workspace = true
deskrinch-test-screen.workspace = true
deskrinch-test-wait.workspace = true
tempfile.workspace = true

# The compositor tests run inside nested compositors that
# `cargo xtask compositor-tests` starts; they are ignored by a plain
# `cargo test`.
[[test]]
name = "compositor"
path = "tests/compositor/main.rs"

[lints]
workspace = true
