[package]
name = "deskrinch-test-portal"
description = "A stand-in settings portal for deskrinch's tests and isolated sessions, on a private D-Bus bus."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "deskrinch-test-portal"
path = "src/main.rs"

[dependencies]
deskrinch-test-dbus.workspace = true
tempfile.workspace = true
thiserror.workspace = true
# The server side of D-Bus on zbus's own runtime.
zbus = { workspace = true, features = ["default-rt", "service"] }

[lints]
workspace = true
