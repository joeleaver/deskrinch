[package]
name = "deskrinch-test-dbus"
description = "Private D-Bus session buses for deskrinch's tests, isolated from the real session."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
deskrinch-bus.workspace = true
# The daemon killed, and its directory swept, when the test process dies.
deskrinch-test-lifetime.workspace = true
futures-core.workspace = true
rustix = { workspace = true, features = ["process"] }
tempfile.workspace = true
thiserror.workspace = true
# Waiting for a name: the client side of D-Bus on zbus's own runtime, driven
# by `zbus::block_on`, so this crate's API needs no async runtime.
zbus = { workspace = true, features = ["default-rt"] }

[lints]
workspace = true
