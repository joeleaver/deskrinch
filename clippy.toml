# A failing `unwrap` or `expect` is how a test reports a broken expectation;
# the workspace bans them everywhere else.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
# The shell's components make and run rinch's App through deskrinch-component,
# so that each is made and ends alike (DevTools off unless built with
# `debug`; a lost display ends it with deskrinch-shell's status).
disallowed-methods = [
    { path = "rinch::App::new", reason = "a component's App is deskrinch_component::app::new" },
    { path = "rinch::App::windowless", reason = "a component's App is deskrinch_component::app::windowless" },
    { path = "rinch::App::run", reason = "a component's App ends through deskrinch_component::app::run" },
    { path = "rinch::App::try_run", reason = "a component's App ends through deskrinch_component::app::run" },
    # A subscriber scoped to one thread loses events: tracing caches a
    # callsite's interest for the process from whichever thread hits it
    # first (deskrinch-test-log's documentation says how).
    { path = "tracing::subscriber::with_default", reason = "a thread-scoped subscriber loses events to tracing's process-wide interest cache; capture with deskrinch_test_log::capture" },
    { path = "tracing::subscriber::set_default", reason = "a thread-scoped subscriber loses events to tracing's process-wide interest cache; capture with deskrinch_test_log::capture" },
    { path = "tracing::dispatcher::with_default", reason = "a thread-scoped dispatcher loses events to tracing's process-wide interest cache; capture with deskrinch_test_log::capture" },
    { path = "tracing::dispatcher::set_default", reason = "a thread-scoped dispatcher loses events to tracing's process-wide interest cache; capture with deskrinch_test_log::capture" },
]
# Proper names the docs use that `doc_markdown` would otherwise want in
# backticks; `".."` keeps clippy's default list.
doc-valid-idents = ["AppArmor", "DevTools", "GLib", "KWin", "PipeWire", "ProPhoto", "PulseAudio", "TZif", "WirePlumber", ".."]
