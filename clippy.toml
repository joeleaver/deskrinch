# A failing `unwrap` or `expect` is how a test reports a broken expectation;
# the workspace bans them everywhere else.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
# Proper names the docs use that `doc_markdown` would otherwise want in
# backticks; `".."` keeps clippy's default list.
doc-valid-idents = ["KWin", ".."]
