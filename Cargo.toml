[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Clones of rinch (and its forks) for unmerged work live in the gitignored
# `.work/` and are patched in from there. Without this, Cargo would take a
# patched crate under this directory for a member of this workspace instead
# of its own.
exclude = [".work"]

# Metadata every member inherits with `key.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2024"
# The toolchain `rust-toolchain.toml` pins; move the two together.
rust-version = "1.99.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joeleaver/deskrinch"
publish = false

# Every version lives here. A member names a dependency with
# `name.workspace = true` and adds only the features it needs.
[workspace.dependencies]
bitflags = "2.13.2"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
deskrinch-appearance = { path = "crates/deskrinch-appearance" }
deskrinch-applications = { path = "crates/deskrinch-applications" }
deskrinch-bus = { path = "crates/deskrinch-bus" }
deskrinch-clock = { path = "crates/deskrinch-clock" }
deskrinch-component = { path = "crates/deskrinch-component" }
deskrinch-config = { path = "crates/deskrinch-config" }
deskrinch-desktop-entries = { path = "crates/deskrinch-desktop-entries" }
deskrinch-gestures = { path = "crates/deskrinch-gestures" }
deskrinch-icons = { path = "crates/deskrinch-icons" }
deskrinch-keyfile = { path = "crates/deskrinch-keyfile" }
deskrinch-kwin-access = { path = "crates/deskrinch-kwin-access" }
deskrinch-settings = { path = "crates/deskrinch-settings" }
deskrinch-status-notifier = { path = "crates/deskrinch-status-notifier" }
deskrinch-taskbar = { path = "crates/deskrinch-taskbar" }
deskrinch-test-client = { path = "crates/deskrinch-test-client" }
deskrinch-test-component = { path = "crates/deskrinch-test-component" }
deskrinch-test-dbus = { path = "crates/deskrinch-test-dbus" }
deskrinch-test-input = { path = "crates/deskrinch-test-input" }
deskrinch-test-lifetime = { path = "crates/deskrinch-test-lifetime" }
deskrinch-test-portal = { path = "crates/deskrinch-test-portal" }
deskrinch-test-screen = { path = "crates/deskrinch-test-screen" }
deskrinch-test-wayland = { path = "crates/deskrinch-test-wayland" }
deskrinch-theme = { path = "crates/deskrinch-theme" }
deskrinch-timer = { path = "crates/deskrinch-timer" }
deskrinch-untrusted = { path = "crates/deskrinch-untrusted" }
deskrinch-watch = { path = "crates/deskrinch-watch" }
deskrinch-wayland-client = { path = "crates/deskrinch-wayland-client" }
deskrinch-window-management = { path = "crates/deskrinch-window-management" }
deskrinch-xdg = { path = "crates/deskrinch-xdg" }
futures-core = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
icu_casemap = "2.4.0"
icu_datetime = "2.4.0"
icu_locale_core = "2.4.0"
icu_normalizer = "2.4.0"
icu_properties = "2.4.0"
icu_provider = { version = "2.4.0", default-features = false }
jiff = { version = "0.2.42", default-features = false }
jiff-icu = { version = "0.2.4", default-features = false }
# A StatusNotifierItem implementation, only for the status-notifier host's
# interoperability test. Its own default runtime is tokio; async-io pulls in
# less.
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2.191"
percent-encoding = "2.3.2"
# The version rinch's image stack already locks; it has no default features.
png = "0.18.1"
proptest = { version = "1.12.0", default-features = false, features = ["std", "timeout"] }
# The GUI framework, from its `main` branch: never a path. Unmerged rinch work
# is tried through a `[patch]` in `.cargo/config.local.toml`. Its own default
# features are off; a member names `desktop` (and `gpu`) itself.
rinch = { git = "https://github.com/joeleaver/rinch", branch = "main", default-features = false }
rustix = "1.1.6"
serde = "1.0.229"
serde_ignored = "0.1.14"
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = { version = "1.2.1", default-features = false }
# The version rinch logs through.
tracing = "0.1.44"
wayland-client = "0.31.15"
wayland-protocols = "0.32.13"
wayland-protocols-misc = "0.3.12"
wayland-protocols-plasma = "0.3.12"
wayland-protocols-wlr = "0.3.12"
zbus = { version = "6.2.1", default-features = false }

# One lint policy for the whole repository; every member opts in with
# `[lints] workspace = true`. Lints are set to `warn` and CI turns every
# warning into an error (`-D warnings`), so an edit in progress still builds
# locally while nothing reaches `main` with a warning.
#
# A crate that needs an exception uses `#[expect(lint, reason = "...")]` at
# the narrowest item, never a crate-wide allow.
[workspace.lints.rust]
# `unsafe` needs a written safety argument (CLAUDE.md). `deny` rather than
# `forbid` so a justified block can carry `#[expect(unsafe_code, reason)]`
# next to its `// SAFETY:` comment; clippy's `undocumented_unsafe_blocks`
# below insists on that comment.
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
unused_import_braces = "warn"
let_underscore_drop = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The `cargo` group is left out on purpose: its `multiple_crate_versions`
# fires on duplicate versions deep in the wgpu and smithay trees that this
# repository cannot change. `cargo deny` reports duplicates instead.
#
# Picked from `restriction`:
# Errors are typed values: no panicking shortcuts outside tests (clippy.toml
# allows them in tests).
unwrap_used = "warn"
expect_used = "warn"
# Nothing "for now": no placeholders or debugging leftovers.
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# Every lint exception says why, and goes stale loudly (`expect`, not `allow`).
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Every `unsafe` block carries its safety argument.
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
multiple_unsafe_ops_per_block = "warn"
clone_on_ref_ptr = "warn"
