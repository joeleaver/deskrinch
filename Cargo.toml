[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Clones of rinch (and its forks) for unmerged work live in the gitignored
# `.work/` and are patched in from there. Without this, Cargo would take a
# patched crate under this directory for a member of this workspace instead
# of its own.
exclude = [".work"]

# Metadata every member inherits with `key.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2024"
# The toolchain `rust-toolchain.toml` pins; move the two together.
rust-version = "1.99.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joeleaver/deskrinch"
publish = false

# Every version lives here. A member names a dependency with
# `name.workspace = true` and adds only the features it needs.
[workspace.dependencies]
bitflags = "2.13.2"
bytemuck = "1.25.2"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
deskrinch-appearance = { path = "crates/deskrinch-appearance" }
deskrinch-applications = { path = "crates/deskrinch-applications" }
deskrinch-bars = { path = "crates/deskrinch-bars" }
deskrinch-bus = { path = "crates/deskrinch-bus" }
deskrinch-clock = { path = "crates/deskrinch-clock" }
deskrinch-component = { path = "crates/deskrinch-component" }
deskrinch-config = { path = "crates/deskrinch-config" }
deskrinch-desktop-entries = { path = "crates/deskrinch-desktop-entries" }
deskrinch-gestures = { path = "crates/deskrinch-gestures" }
deskrinch-icons = { path = "crates/deskrinch-icons" }
deskrinch-keyfile = { path = "crates/deskrinch-keyfile" }
deskrinch-kwin-access = { path = "crates/deskrinch-kwin-access" }
deskrinch-launcher-client = { path = "crates/deskrinch-launcher-client" }
deskrinch-notification-service = { path = "crates/deskrinch-notification-service" }
deskrinch-picture = { path = "crates/deskrinch-picture" }
deskrinch-settings = { path = "crates/deskrinch-settings" }
deskrinch-shell = { path = "crates/deskrinch-shell" }
deskrinch-start-record = { path = "crates/deskrinch-start-record" }
deskrinch-status-notifier = { path = "crates/deskrinch-status-notifier" }
deskrinch-switcher = { path = "crates/deskrinch-switcher" }
deskrinch-taskbar = { path = "crates/deskrinch-taskbar" }
deskrinch-test-client = { path = "crates/deskrinch-test-client" }
deskrinch-test-component = { path = "crates/deskrinch-test-component" }
deskrinch-test-dbus = { path = "crates/deskrinch-test-dbus" }
deskrinch-test-input = { path = "crates/deskrinch-test-input" }
deskrinch-test-lifetime = { path = "crates/deskrinch-test-lifetime" }
deskrinch-test-log = { path = "crates/deskrinch-test-log" }
deskrinch-test-notify = { path = "crates/deskrinch-test-notify" }
deskrinch-test-pictures = { path = "crates/deskrinch-test-pictures" }
deskrinch-test-portal = { path = "crates/deskrinch-test-portal" }
deskrinch-test-kwin = { path = "crates/deskrinch-test-kwin" }
deskrinch-test-screen = { path = "crates/deskrinch-test-screen" }
deskrinch-test-session = { path = "crates/deskrinch-test-session" }
deskrinch-test-wayland = { path = "crates/deskrinch-test-wayland" }
deskrinch-test-wait = { path = "crates/deskrinch-test-wait" }
deskrinch-theme = { path = "crates/deskrinch-theme" }
deskrinch-timer = { path = "crates/deskrinch-timer" }
deskrinch-untrusted = { path = "crates/deskrinch-untrusted" }
deskrinch-watch = { path = "crates/deskrinch-watch" }
deskrinch-wayland-client = { path = "crates/deskrinch-wayland-client" }
deskrinch-workspaces = { path = "crates/deskrinch-workspaces" }
deskrinch-window-management = { path = "crates/deskrinch-window-management" }
deskrinch-xdg = { path = "crates/deskrinch-xdg" }
# Resampling for deskrinch-picture's fit: SIMD, and a 16-bit linear-light
# path of its own.
fast_image_resize = "6.2.0"
futures-core = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
# The versions `image` already locks: deskrinch-picture uses the decoders
# directly, each with limits of its own, so there is one copy of each.
gif = "0.14.2"
# The version the tree already locks; its keyed default hasher (foldhash),
# for tables whose keys live outside them (`HashTable`).
hashbrown = { version = "0.17.1", default-features = false, features = ["default-hasher"] }
icu_casemap = "2.4.0"
icu_datetime = "2.4.0"
icu_locale_core = "2.4.0"
icu_normalizer = "2.4.0"
icu_properties = "2.4.0"
icu_provider = { version = "2.4.0", default-features = false }
# The version and formats rinch decodes pictures with.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
image-webp = "0.2.4"
jiff = { version = "0.2.42", default-features = false }
jiff-icu = { version = "0.2.4", default-features = false }
# A StatusNotifierItem implementation, only for the status-notifier host's
# interoperability test. Its own default runtime is tokio; async-io pulls in
# less.
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2.191"
# The colour management `image` already brings, with the features it has
# there, for converting an embedded ICC profile to sRGB.
moxcms = "0.8.1"
# A counting global allocator, for deskrinch-picture's test of its working
# bound.
peak_alloc = "0.3.0"
percent-encoding = "2.3.2"
# The version rinch's image stack already locks; it has no default features.
png = "0.18.1"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# The GUI framework, from its `main` branch: never a path. Unmerged rinch work
# is tried through a `[patch]` in `.cargo/config.local.toml`. Its own default
# features are off; a member names `desktop` (and `gpu`) itself.
rinch = { git = "https://github.com/joeleaver/rinch", branch = "main", default-features = false }
rustix = "1.1.6"
serde = "1.0.229"
serde_ignored = "0.1.14"
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
# Only the hash: neither its OIDs nor `alloc`.
sha2 = { version = "0.11.1", default-features = false }
signal-hook = "0.3.18"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = { version = "1.2.1", default-features = false }
# The version rinch logs through.
tracing = "0.1.44"
wayland-client = "0.31.15"
wayland-protocols = "0.32.13"
wayland-protocols-misc = "0.3.12"
wayland-protocols-plasma = "0.3.12"
wayland-protocols-wlr = "0.3.12"
zbus = { version = "6.2.1", default-features = false }
zune-core = "0.5.3"
zune-jpeg = "0.5.15"

# One lint policy for the whole repository; every member opts in with
# `[lints] workspace = true`. Lints are set to `warn` and CI turns every
# warning into an error (`-D warnings`), so an edit in progress still builds
# locally while nothing reaches `main` with a warning.
#
# A crate that needs an exception uses `#[expect(lint, reason = "...")]` at
# the narrowest item, never a crate-wide allow.
[workspace.lints.rust]
# `unsafe` needs a written safety argument (CLAUDE.md). `deny` rather than
# `forbid` so a justified block can carry `#[expect(unsafe_code, reason)]`
# next to its `// SAFETY:` comment; clippy's `undocumented_unsafe_blocks`
# below insists on that comment.
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
unused_import_braces = "warn"
let_underscore_drop = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The `cargo` group is left out on purpose: its `multiple_crate_versions`
# fires on duplicate versions deep in the wgpu and smithay trees that this
# repository cannot change. `cargo deny` reports duplicates instead.
#
# Picked from `restriction`:
# Errors are typed values: no panicking shortcuts outside tests (clippy.toml
# allows them in tests).
unwrap_used = "warn"
expect_used = "warn"
# Nothing "for now": no placeholders or debugging leftovers.
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# Every lint exception says why, and goes stale loudly (`expect`, not `allow`).
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Every `unsafe` block carries its safety argument.
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
multiple_unsafe_ops_per_block = "warn"
clone_on_ref_ptr = "warn"

# Crates whose work is per-pixel arithmetic are optimised in dev builds, so
# that tests and dev runs do not spend their time in unoptimised loops. Each
# is named here with what it does, what the override saved, what it costs to
# build, and the date.
#
# - An override sets `opt-level` and nothing else: debug assertions and
#   overflow checks stay on in the crate, as in the rest of the dev build:
#   the dev profile leaves `debug-assertions` on, and Cargo's documented
#   default for `overflow-checks` follows `debug-assertions`.
# - A dependency is named when a profile shows the time is in its own code,
#   which our crate's level cannot reach: generic code is compiled at the
#   level of the crate that instantiates it, the dependency's own functions
#   at the dependency's.
# - A code fix comes before an override where one removes the cost. So the
#   decode path has none: deskrinch-untrusted's zeroed buffer was 46% of a
#   5120 x 2880 PNG decode in a dev build, a byte-by-byte loop; written as
#   one memset, the decode went from 11.72 G to 5.00 G instructions, and
#   what is left (png's unfiltering, the widening to RGBA) measured the same
#   optimised or not, within noise.
#
# The screen capture's pixel conversion: a capture went from 21.7 to 9.2 ms
# under KWin and from 14.7 to 7.6 ms under sway (2026-11-17); the build cost
# was not measured then. KWin's premultiplied pixels are unpremultiplied in
# deskrinch-test-wayland's `Rgba`, so both crates or neither.
[profile.dev.package.deskrinch-test-screen]
opt-level = 3

[profile.dev.package.deskrinch-test-wayland]
opt-level = 3

# The wallpaper's resampling, deskrinch-picture's `fit` (2026-11-23). One
# compositor job's 17 fits (the wallpaper suite's, counted) took 20 to 29 s
# of CPU unoptimised, about 9 s with deskrinch-picture alone at 3, and under
# 1 s with fast_image_resize too. A 5120 x 2880 fit, profiled unoptimised,
# was 93% fast_image_resize's own code (its sRGB mapper 42%, its
# convolution kernels 51%), which deskrinch-picture's level does not reach.
# The cost, once per build cache, nothing on an exact hit: deskrinch-picture
# builds in about 60 s of CPU at 3 where it took 3.5 s, fast_image_resize
# about 7 s more; so a change to deskrinch-picture costs a developer about
# a minute of CPU to rebuild.
[profile.dev.package.deskrinch-picture]
opt-level = 3

[profile.dev.package.fast_image_resize]
opt-level = 3
